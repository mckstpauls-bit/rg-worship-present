# Builds the Windows installer and publishes it as a GitHub Release, together with the content packs
# and the updates.json that RG-Present's in-app updater reads.
#
# Publish a new version:
#   npm version 1.2.0 && git push --follow-tags
#
# Then point Settings -> Updates on each church computer at:
#   https://github.com/YOUR-ACCOUNT/rg-worship-present/releases/latest/download/updates.json
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build content packs
        run: npm run build-packs

      - name: Build icons
        run: npx electron tools/make-icons.js

      - name: Build installer
        run: npx electron-builder --win --publish never

      - name: Build update feed
        run: node tools/make-update-feed.js feed --notes "${{ github.ref_name }}"

      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            feed/updates.json
            feed/*.exe
            feed/*.rgpkg
