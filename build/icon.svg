<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- RG-Present app icon: a projection screen throwing light, with a cross as the thing being shown. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3b6b"/>
      <stop offset="0.55" stop-color="#16203f"/>
      <stop offset="1" stop-color="#0a0e1d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffe9b0"/>
      <stop offset="0.45" stop-color="#f0c46a"/>
      <stop offset="1" stop-color="#c8912f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#9fc4ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9fc4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#cfe2ff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#cfe2ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="232" r="190" fill="url(#glow)"/>

  <!-- light spilling from the screen -->
  <path d="M256 196 L92 470 H420 Z" fill="url(#beam)"/>

  <!-- screen -->
  <rect x="96" y="96" width="320" height="216" rx="20" fill="#0b1226" stroke="url(#gold)" stroke-width="12"/>

  <!-- cross on the screen -->
  <g fill="url(#gold)">
    <rect x="238" y="134" width="36" height="140" rx="8"/>
    <rect x="196" y="176" width="120" height="36" rx="8"/>
  </g>

  <!-- stand -->
  <rect x="242" y="312" width="28" height="48" rx="8" fill="url(#gold)" opacity="0.92"/>
  <rect x="170" y="356" width="172" height="26" rx="13" fill="url(#gold)" opacity="0.92"/>
</svg>
